[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eventfold"
version = "0.1.1"
description = "Lossless event-at-a-time compression for server-sent event streams"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["sse", "server-sent-events", "streaming", "compression"]

[project.urls]
Homepage = "https://eventfold.tancurl3.chatgpt.site"
Source = "https://github.com/pgg898200-ship-it/backfold/tree/eventfold-v0.1/companions/eventfold"
Issues = "https://github.com/pgg898200-ship-it/backfold/issues"

[project.scripts]
eventfold = "eventfold.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
