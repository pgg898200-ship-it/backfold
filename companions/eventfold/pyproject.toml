[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eventfold"
version = "0.1.0"
description = "Lossless event-at-a-time compression for server-sent event streams"
requires-python = ">=3.10"
license = {file = "LICENSE"}
readme = "README.md"
keywords = ["sse", "server-sent-events", "streaming", "compression"]

[project.scripts]
eventfold = "eventfold.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
