[package]
name = "backfold-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Zero-dependency WebAssembly target for backfold: real-time in-browser O(log T) Kalman RTS smoothing, changepoint Bayes factors, and <300-token stream digests"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
backfold-core = { version = "0.3.0", path = "../backfold-core", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
