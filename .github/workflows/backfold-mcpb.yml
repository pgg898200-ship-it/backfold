name: Publish Backfold MCP bundle
on:
  push:
    branches: [main]
    paths: [integrations/mcpb/server.json]
  workflow_dispatch:

permissions: {}
concurrency:
  group: backfold-mcpb-0.3.0
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python integrations/mcpb/build.py
      - run: python integrations/mcpb/smoke.py backfold-0.3.0.mcpb

  attach:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python integrations/mcpb/build.py
      - name: Attach verified bundle to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=backfold-0.3.0.mcpb
          hash=$(jq -er '.packages[0].fileSha256' integrations/mcpb/server.json)
          echo "$hash  $file" | sha256sum -c -
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.3.0" --jq '.assets[] | select(.name == "backfold-0.3.0.mcpb") | .id')
          if [[ -z "$asset" ]]; then
            gh release upload v0.3.0 "$file"
          fi
          gh release download v0.3.0 -p "$file" -D "$RUNNER_TEMP"
          echo "$hash  $RUNNER_TEMP/$file" | sha256sum -c -

  register:
    needs: attach
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check current registry version
        id: listed
        working-directory: integrations/mcpb
        run: |
          set -euo pipefail
          url='https://registry.modelcontextprotocol.io/v0.1/servers/io.github.pgg898200-ship-it%2Fbackfold/versions/0.3.0'
          status=$(curl -sS -o "$RUNNER_TEMP/entry.json" -w '%{http_code}' "$url")
          case "$status" in
            200)
              jq -e --slurpfile desired server.json '.server.name == $desired[0].name and .server.version == $desired[0].version and .server.packages[0].identifier == $desired[0].packages[0].identifier and .server.packages[0].fileSha256 == $desired[0].packages[0].fileSha256' "$RUNNER_TEMP/entry.json"
              echo 'exists=true' >> "$GITHUB_OUTPUT"
              ;;
            404) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "Registry returned HTTP $status"; exit 1 ;;
          esac
      - name: Publish with GitHub OIDC
        if: steps.listed.outputs.exists == 'false'
        working-directory: integrations/mcpb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          url='https://github.com/modelcontextprotocol/registry/releases/download/v1.8.13/mcp-publisher_linux_amd64.tar.gz'
          curl -fsSL "$url" -o "$archive"
          echo "7a708f418788d962a1ca3d6744d4cf86ed95f790d33c7abf562916ff83be61d2  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
