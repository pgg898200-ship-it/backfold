name: Reproduce Patchfleet
on:
  push:
    paths:
      - 'labs/patchfleet/**'
      - '.github/workflows/patchfleet-reproduce.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: labs/patchfleet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned external reference and test dependencies
        run: python -m pip install ruff==0.11.13 numpy==2.2.6 scipy==1.15.3 pytest==8.3.5 lxml==5.4.0 matplotlib==3.10.3 pillow==11.2.1
      - name: Check tamper rejection and byte preservation
        run: python research/test_codec.py
      - name: Fetch immutable public release trees
        run: python fetch.py "$RUNNER_TEMP/fleet"
      - name: Independently regenerate every output with Ruff and Git
        run: |
          python build.py "$RUNNER_TEMP/fleet" "$RUNNER_TEMP/rebuilt"
          cmp artifacts/numpy2.fleet.xz "$RUNNER_TEMP/rebuilt/numpy2.fleet.xz"
      - name: Reproduce deployment on unseen releases and upstream tests
        run: |
          python research/incremental_replay.py "$RUNNER_TEMP/fleet" "$RUNNER_TEMP/incremental.json"
          cmp research/incremental.json "$RUNNER_TEMP/incremental.json"
          python research/upstream_tests.py "$RUNNER_TEMP/fleet/objects/networkx" "$RUNNER_TEMP/upstream.json"
          cmp research/upstream.local.json "$RUNNER_TEMP/upstream.json"
      - name: Publish machine-readable measurements
        uses: actions/upload-artifact@v4
        with:
          name: independently-rebuilt-capsule
          path: |
            ${{ runner.temp }}/rebuilt
            ${{ runner.temp }}/incremental.json
            ${{ runner.temp }}/upstream.json
  commit-stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: labs/patchfleet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.11.13
      - name: Fetch 128 actual first-parent commits plus their objects
        run: |
          git init --bare "$RUNNER_TEMP/scikit"
          git -C "$RUNNER_TEMP/scikit" fetch --quiet --shallow-since=2023-07-01 --no-tags https://github.com/scikit-image/scikit-image.git a160f384523ac70173d069954b7084bee79fb68e
      - name: Check every intermediate tree against two cached Git and Ruff pipelines
        run: |
          python research/commit_stream.py "$RUNNER_TEMP/scikit" "$RUNNER_TEMP/commits.json"
          python research/parent_baseline.py "$RUNNER_TEMP/scikit" "$RUNNER_TEMP/parent.json" "$RUNNER_TEMP/commits.json"
          python -c 'import json,os; from pathlib import Path; a=json.loads((Path(os.environ["RUNNER_TEMP"])/"commits.json").read_text()); b=json.load(open("research/commits.local.json")); assert all(a[k]==b[k] for k in ("parsed","file_instances","tree_sequence_sha256")); print(json.dumps(a,indent=2))'
      - uses: actions/upload-artifact@v4
        with:
          name: commit-stream-measurements
          path: |
            ${{ runner.temp }}/commits.json
            ${{ runner.temp }}/parent.json
  agent-patches:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: labs/patchfleet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the pinned external compressor
        run: |
          git clone --quiet --depth 1 --branch v1.5.7 https://github.com/facebook/zstd.git "$RUNNER_TEMP/zstd"
          test "$(git -C "$RUNNER_TEMP/zstd" rev-parse HEAD)" = f8745da6ff1ad1e7bab384bd1f9d742439278e99
          make -s -C "$RUNNER_TEMP/zstd/programs" -j2 zstd
          echo "$RUNNER_TEMP/zstd/programs" >> "$GITHUB_PATH"
      - name: Download original submissions and verify every held-out patch byte
        run: |
          python research/holdout.py "$RUNNER_TEMP/agent-data" "$RUNNER_TEMP/heldout.json" heldout
          python -c 'import json,os; from pathlib import Path; a=json.loads((Path(os.environ["RUNNER_TEMP"])/"heldout.json").read_text()); b=json.load(open("research/heldout.json")); assert all(a[k]==b[k] for k in ("verified_sha256","archive_sha256","archive_bytes","records")); print(json.dumps(a,indent=2))'
      - name: Reproduce the identical archive using one encoder pass
        run: |
          python research/codec_cost.py "$RUNNER_TEMP/agent-data" "$RUNNER_TEMP/fixed.json" --columns-only
          cat "$RUNNER_TEMP/fixed.json"
      - name: Reproduce the strongest stock zstd comparisons
        run: |
          python research/partitions.py "$RUNNER_TEMP/agent-data" "$RUNNER_TEMP/partitions.json"
          cmp research/partitions.json "$RUNNER_TEMP/partitions.json"
          cd "$RUNNER_TEMP/agent-data"
          zstd -q --ultra -22 --long=27 --patch-from=heldout.base -c heldout.raw > baseline.zst
          zstd -q -d --long=27 --patch-from=heldout.base -c baseline.zst | cmp heldout.raw -
          python -c 'import os; from pathlib import Path; a=Path("baseline.zst").stat().st_size; b=Path("heldout.pfw").stat().st_size; assert b<a; print("stock",a,"patchfleet",b)'
      - uses: actions/upload-artifact@v4
        with:
          name: held-out-coding-agent-measurements
          path: |
            ${{ runner.temp }}/heldout.json
            ${{ runner.temp }}/partitions.json
            ${{ runner.temp }}/fixed.json
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: labs/patchfleet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 tokenizers==0.21.4 safetensors==0.5.3 threadpoolctl==3.6.0
      - name: Measure late corrections with pinned Pythia weights and original source tokens
        run: |
          OPENBLAS_NUM_THREADS=1 python research/checkpoint_preview.py "$RUNNER_TEMP/pythia" "$RUNNER_TEMP/checkpoint.json"
          python -c 'import json, os; from pathlib import Path; d=json.loads((Path(os.environ["RUNNER_TEMP"])/"checkpoint.json").read_text()); assert d["tokens"]==1536 and min(r["corrected_fraction_fp16"] for r in d["results"])>0.93; print(json.dumps(d,indent=2))'
