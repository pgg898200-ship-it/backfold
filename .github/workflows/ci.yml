name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (strict zero warnings)
        run: cargo clippy --package backfold-core --package backfold-cli --all-targets -- -D warnings
      - name: Core unit + Adversarial Breaker tests (release)
        run: cargo test --package backfold-core --package backfold-cli --release
      - name: CLI smoke test
        run: cargo run --release --bin backfold -- demo

  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build & test dependencies
        run: pip install maturin pytest ruff numpy scipy pandas polars river
      - name: Build & install native extension wheel
        run: |
          maturin build --release --out dist
          pip install --force-reinstall dist/*.whl
      - name: Run pytest parity suite
        env:
          PYTHONPATH: .
        run: pytest -v tests/
      - name: Run runnable examples
        run: |
          python examples/kalman_rts_smoothing.py
          python examples/multivariate_anomaly_cov.py
          python examples/polars_late_arrivals.py
      - name: Lint with ruff
        run: ruff check python/ benchmarks/ tests/ examples/
