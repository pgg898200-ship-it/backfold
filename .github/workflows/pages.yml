name: Deploy Live WebAssembly Playground, Docs & llms.txt to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Compile backfold-wasm (real Rust core -> wasm32-unknown-unknown)
        run: cargo build --release --package backfold-wasm --target wasm32-unknown-unknown
      - name: Assemble live WASM playground, SEO/AI discovery & benchmark explorer site
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp docs/og-card.png _site/og-card.png
          cp docs/robots.txt _site/robots.txt
          cp docs/sitemap.xml _site/sitemap.xml
          cp target/wasm32-unknown-unknown/release/backfold_wasm.wasm _site/backfold_wasm.wasm
          cp llms.txt _site/llms.txt
          cp llms-full.txt _site/llms-full.txt
          cp skills/backfold/SKILL.md _site/SKILL.md
          cp README.md _site/README.md
          cp docs/ARCHITECTURE.md _site/ARCHITECTURE.md
          cp docs/SUBNORMAL_KALMAN.md _site/SUBNORMAL_KALMAN.md
          cp benchmarks/results.json _site/results.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
