name: Deploy Documentation & llms.txt to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble pure-Markdown + benchmark explorer site
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp llms.txt _site/llms.txt
          cp llms-full.txt _site/llms-full.txt
          cp README.md _site/README.md
          cp docs/ARCHITECTURE.md _site/ARCHITECTURE.md
          cp docs/SUBNORMAL_KALMAN.md _site/SUBNORMAL_KALMAN.md
          cp benchmarks/results.json _site/results.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
