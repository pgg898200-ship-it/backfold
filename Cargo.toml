[workspace]
resolver = "2"
members = [
    "crates/backfold-core",
    "crates/backfold-cli",
    "crates/backfold-py",
    "crates/backfold-wasm",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Persistent O(log T) associative-monoid engine for out-of-order, retractable, forkable online statistical inference and agent stream compression"
repository = "https://github.com/pgg898200-ship-it/backfold"
keywords = ["streaming", "time-series", "kalman", "online-learning", "changepoint"]
categories = ["algorithms", "science", "mathematics", "data-structures"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
